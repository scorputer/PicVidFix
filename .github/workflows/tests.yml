name: Python smoke tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Compile desktop app, inspector and reference comparison tools
        run: python -m py_compile video_color_gui.py region_inspector.py reference_match.py reference_dialog.py reference_preview.py light_ring.py
      - run: python -m unittest discover -s tests -v
