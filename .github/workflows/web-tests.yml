name: PicVidFix Web checks

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        working-directory: web
        run: npm run check
      - name: Run browser-engine unit tests
        working-directory: web
        run: npm test
